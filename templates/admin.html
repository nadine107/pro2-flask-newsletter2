<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Newsletter-Anmeldungen</h1>

    <table>
        <th>Email </th>
        <th>Name </th>
        <th>Nachname </th>
        <th>Löschen</th>
    
    {% for anmeldung in daten %}

        <tr>
            <td>{{ anmeldung.email }}</td>
            <td>{{ anmeldung.name }}</td>
            <td> {{ anmeldung.nachname }}</td>
            <td><a href="/delete/ {{ anmeldung.id}}">Hier klickern, um Person zu löschen</a></td>
        </tr>

    {% endfor %}
    </table>
    <ul>
        <a href="/">Weitere Person erfassen</a>
    </ul>
</body>
</html>
